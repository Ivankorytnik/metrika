name = "atom-metrika-dashboard"
main = "src/worker.mjs"
compatibility_date = "2026-11-25"
workers_dev = true
preview_urls = false

[assets]
directory = "./public"
binding = "ASSETS"
run_worker_first = true

# Ежечасная синхронизация отчёта за последние 30 дней (бесплатный тариф Workers).
[triggers]
crons = ["17 * * * *"]

# Привязка KV (CACHE) добавляется в CI автоматически: workflow находит или создаёт
# пространство atom-metrika-cache и дописывает его id перед деплоем.
