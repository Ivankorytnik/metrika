name = "atom-metrika-dashboard"
main = "src/worker.mjs"
compatibility_date = "2026-11-25"
workers_dev = true
preview_urls = false

[assets]
directory = "./public"
binding = "ASSETS"
run_worker_first = true

# Application-level fail-closed guard. This does not change Cloudflare billing settings.
[vars]
FREE_ONLY = "true"
