name: Test only (never deploy)
on:
  push:
    branches: [main, security/free-only-access-20261125]
  pull_request:
    branches: [main]
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node --test
      - run: node --check src/worker.mjs
      - run: node --check public/dashboard.js
      # No secrets and no deploy on CI.
